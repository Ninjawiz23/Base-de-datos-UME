<script>
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzFAxE_bUtyto2tTELFqY-Kn4fugVsFf3aUH56nhceAsPkjXdhCTE67e5xwHL0_BhyAjg/exec";

const registros = [];

function normalizarTexto(texto) {
  return String(texto || "")
    .toLocaleLowerCase("es")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function posiblesIdentidades(agente) {
  return [
    agente.apodo,
    agente.nombre,
    `${agente.apodo} ${agente.nombre}`,
    `${agente.nombre} ${agente.apodo}`,
    agente.identificacion
  ]
    .map(normalizarTexto)
    .filter(Boolean);
}

function perteneceAlAgente(registro, agente) {
  const nombreRegistro = normalizarTexto(registro.agente);

  return posiblesIdentidades(agente).some(identidad =>
    nombreRegistro === identidad ||
    nombreRegistro.includes(identidad) ||
    identidad.includes(nombreRegistro)
  );
}

function registrosDelAgente(agente) {
  return registros.filter(registro => perteneceAlAgente(registro, agente));
}

function fechaNormalizada(valor) {
  if (!valor) return "";
  return String(valor).slice(0, 10);
}

function fechaVisible(valor) {
  const fecha = fechaNormalizada(valor);
  if (!fecha) return "—";

  const objeto = new Date(`${fecha}T12:00:00`);
  return Number.isNaN(objeto.getTime())
    ? fecha
    : objeto.toLocaleDateString("es-ES");
}

function ordenarPorFechaDesc(lista) {
  return [...lista].sort((a, b) =>
    fechaNormalizada(b.fecha).localeCompare(fechaNormalizada(a.fecha))
  );
}

function pintar() {
  const busqueda = normalizarTexto(buscarAgente.value);
  listaRangos.innerHTML = "";

  let agentesVisibles = 0;
  let total = 0;

  agentes.forEach(grupo => {
    const miembros = grupo.miembros.filter(agente => {
      const texto = `${agente.apodo} ${agente.nombre} ${agente.identificacion} ${grupo.rango}`;
      return !busqueda || normalizarTexto(texto).includes(busqueda);
    });

    if (!miembros.length) return;

    const bloque = document.createElement("section");
    bloque.className = "rank-block";
    bloque.innerHTML = `<h3 class="rank-title">${grupo.rango}</h3>`;

    const grid = document.createElement("div");
    grid.className = "agent-grid";

    miembros.forEach(agente => {
      const lista = ordenarPorFechaDesc(registrosDelAgente(agente));
      const cantidad = lista.length;
      agentesVisibles++;
      total += cantidad;

      const card = document.createElement("button");
      card.type = "button";
      card.className = "agent-card";
      card.innerHTML = `
        <div class="agent-rank">${grupo.rango}</div>
        <div class="agent-name">${agente.apodo}${agente.nombre ? ` · ${agente.nombre}` : ""}</div>
        ${agente.identificacion ? `<div class="agent-id">Identificación: ${agente.identificacion}</div>` : ""}
        <div class="agent-count"><strong>${cantidad}</strong><span>reanimaciones</span></div>
        <span class="edit-agent" title="Editar perfil">✎</span>
      `;

      card.addEventListener("click", () => abrirDetalle(agente, grupo.rango));
      card.querySelector(".edit-agent").addEventListener("click", evento => {
        evento.stopPropagation();
        abrirEditor(agente, grupo.rango);
      });

      grid.appendChild(card);
    });

    bloque.appendChild(grid);
    listaRangos.appendChild(bloque);
  });

  totalReanimaciones.textContent = total;
  mensajeVacio.hidden = agentesVisibles !== 0;
}

function abrirDetalle(agente, rango) {
  const lista = ordenarPorFechaDesc(registrosDelAgente(agente));

  document.getElementById("modalNombre").textContent = agente.nombre
    ? `${agente.apodo} · ${agente.nombre}`
    : agente.apodo;

  document.getElementById("modalRango").textContent = agente.identificacion
    ? `${rango} · ID ${agente.identificacion}`
    : rango;

  document.getElementById("modalTotal").textContent = lista.length;
  document.getElementById("modalFecha").textContent = lista.length
    ? fechaVisible(lista[0].fecha)
    : "—";

  document.getElementById("modalLista").innerHTML = lista.length
    ? lista.map(registro => `
        <div class="revive-item">
          <div class="revive-date">${fechaVisible(registro.fecha)}</div>
          <div style="margin-top:6px;color:#1d1a15;font-size:14px;white-space:pre-line">
            REGISTRO UME · PERSONA REVIVIDA<br>
            Agente: ${registro.agente}<br>
            Fecha: ${fechaVisible(registro.fecha)}<br>
            Clip: <a class="revive-link" href="${registro.clip}" target="_blank" rel="noopener noreferrer">${registro.clip}</a>
          </div>
        </div>
      `).join("")
    : `<div class="empty" style="color:var(--muted);border-color:var(--line)">Este agente todavía no tiene reanimaciones registradas.</div>`;

  detalleBackdrop.classList.add("visible");
}

async function cargarRegistros() {
  try {
    const respuesta = await fetch(`${URL_APPS_SCRIPT}?t=${Date.now()}`, {
      method: "GET",
      cache: "no-store"
    });

    if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);

    const datos = await respuesta.json();
    if (!datos.ok || !Array.isArray(datos.registros)) {
      throw new Error(datos.error || "Respuesta inválida");
    }

    registros.splice(0, registros.length, ...datos.registros);
    pintar();
  } catch (error) {
    console.error("No se pudieron cargar los datos de Google Sheets:", error);
    pintar();
  }
}

cargarRegistros();
setInterval(cargarRegistros, 5000);
</script>

<!-- IMPORTANTE:
En pintar() y abrirDetalle() se usan registrosDelAgente(agente).
No uses delAgente(), porque comparaba toda la identidad completa y no encontraba el registro "Japo".
-->
