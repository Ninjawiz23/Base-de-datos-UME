<script>
    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbzFAxE_bUtyto2tTELFqY-Kn4fugVsFf3aUH56nhceAsPkjXdhCTE67e5xwHL0_BhyAjg/exec";

    const registros = [];
    let registrosCargados = false;
    let base64ArchivoLocal = null;
    let nombreArchivoLocal = "";
    let tipoMimeLocal = "";

    const abrirRegistro = document.getElementById("abrirRegistro");
    const abrirRecuento = document.getElementById("abrirRecuento");
    const panelRegistro = document.getElementById("registro");
    const panelRecuento = document.getElementById("recuento");
    const panelGrid = document.querySelector(".panel-grid");
    const agenteInput = document.getElementById("agente");
    const fechaInput = document.getElementById("fecha");
    const clipInput = document.getElementById("clip");
    const archivoImagen = document.getElementById("archivoImagen");
    const fileInfo = document.getElementById("fileInfo");
    const guardarBtn = document.getElementById("guardarBtn");
    const copiarBtn = document.getElementById("copiarBtn");
    const previewRegistro = document.getElementById("previewRegistro");
    const statusRegistro = document.getElementById("statusRegistro");
    const buscarAgente = document.getElementById("buscarAgente");
    const resultadoRecuento = document.getElementById("resultadoRecuento");
    const ultimaFecha = document.getElementById("ultimaFecha");
    const listadoAgente = document.getElementById("listadoAgente");

    let hojaActual = "registro";
    let cambiando = false;

    function obtenerFechaLocalISO() {
      const ahora = new Date();
      const local = new Date(ahora.getTime() - ahora.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    fechaInput.value = obtenerFechaLocalISO();

    // Redimensiona y comprime la imagen para evitar desbordar Apps Script
    function optimizarImagen(file, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDimension = 1200;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDimension) {
            height = Math.round((height * maxDimension) / width);
            width = maxDimension;
          } else if (height > maxDimension) {
            width = Math.round((width * maxDimension) / height);
            height = maxDimension;
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          // Devuelve base64 comprimido en JPEG
          const dataUrl = canvas.toDataURL("image/jpeg", 0.75);
          callback(dataUrl);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    archivoImagen.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        nombreArchivoLocal = file.name.replace(/\.[^/.]+$/, "") + ".jpg";
        tipoMimeLocal = "image/jpeg";
        fileInfo.style.display = "block";
        fileInfo.textContent = `Procesando imagen: ${file.name}...`;

        optimizarImagen(file, (base64) => {
          base64ArchivoLocal = base64;
          fileInfo.textContent = `✓ Imagen lista: ${file.name}`;
          clipInput.value = "";
          clipInput.placeholder = "Archivo del PC seleccionado";
        });
      }
    });

    clipInput.addEventListener("input", () => {
      if (clipInput.value.trim() !== "") {
        base64ArchivoLocal = null;
        nombreArchivoLocal = "";
        tipoMimeLocal = "";
        archivoImagen.value = "";
        fileInfo.style.display = "none";
      }
    });

    function ajustarAlturaPanel() {
      const activo = document.querySelector(".doc-panel.activo");
      if (activo) panelGrid.style.minHeight = `${activo.offsetHeight}px`;
    }

    function mostrarHoja(hoja) {
      if (cambiando || hoja === hojaActual) return;
      cambiando = true;

      const anterior = hojaActual === "registro" ? panelRegistro : panelRecuento;
      const siguiente = hoja === "registro" ? panelRegistro : panelRecuento;
      const esRegistro = hoja === "registro";

      abrirRegistro.classList.toggle("activo", esRegistro);
      abrirRecuento.classList.toggle("activo", !esRegistro);
      siguiente.classList.add("activo", esRegistro ? "entrando-izquierda" : "entrando-derecha");
      anterior.classList.add(esRegistro ? "saliendo-derecha" : "saliendo-izquierda");

      setTimeout(() => {
        anterior.classList.remove("activo", "saliendo-derecha", "saliendo-izquierda");
        siguiente.classList.remove("entrando-derecha", "entrando-izquierda");
        hojaActual = hoja;
        cambiando = false;
        ajustarAlturaPanel();
      }, 250);
    }

    abrirRegistro.addEventListener("click", () => mostrarHoja("registro"));
    abrirRecuento.addEventListener("click", () => mostrarHoja("recuento"));
    window.addEventListener("resize", ajustarAlturaPanel);

    function esUrlValida(url) {
      try {
        new URL(url);
        return true;
      } catch {
        return false;
      }
    }

    function obtenerPartesFecha(valor) {
      if (valor === null || valor === undefined || valor === "") return null;
      const texto = String(valor).trim();
      const fechaPura = texto.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (fechaPura) {
        return {
          anio: Number(fechaPura[1]),
          mes: Number(fechaPura[2]),
          dia: Number(fechaPura[3])
        };
      }
      const espana = texto.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (espana) {
        return {
          anio: Number(espana[3]),
          mes: Number(espana[2]),
          dia: Number(espana[1])
        };
      }
      if (/^\d{4}-\d{1,2}-\d{1,2}[T\s]/.test(texto)) {
        const fechaHora = new Date(texto);
        if (!Number.isNaN(fechaHora.getTime())) {
          return {
            anio: fechaHora.getFullYear(),
            mes: fechaHora.getMonth() + 1,
            dia: fechaHora.getDate()
          };
        }
      }
      const fecha = new Date(texto);
      if (!Number.isNaN(fecha.getTime())) {
        return {
          anio: fecha.getFullYear(),
          mes: fecha.getMonth() + 1,
          dia: fecha.getDate()
        };
      }
      return null;
    }

    function fechaParaOrdenar(valor) {
      const p = obtenerPartesFecha(valor);
      return p ? p.anio * 10000 + p.mes * 100 + p.dia : 0;
    }

    function formatearFecha(valor) {
      const p = obtenerPartesFecha(valor);
      if (!p) return "—";
      return `${String(p.dia).padStart(2, "0")}/${String(p.mes).padStart(2, "0")}/${p.anio}`;
    }

    function generarTextoRegistro(registro) {
      const esImagen = /\.(jpeg|jpg|gif|png|webp)($|\?)/i.test(registro.clip) || String(registro.clip).includes("google.com");
      return [
        "REGISTRO UME · PERSONA REVIVIDA",
        "",
        `Agente: ${registro.agente}`,
        `Fecha: ${formatearFecha(registro.fecha)}`,
        `${esImagen ? 'Imagen' : 'Clip'}: ${registro.clip}`
      ].join("\n");
    }

    function limpiarEstado() {
      statusRegistro.textContent = "";
      statusRegistro.className = "status";
    }

    function normalizarTexto(texto) {
      return String(texto || "")
        .toLocaleLowerCase("es")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function perteneceAlAgente(registro, textoBuscado) {
      const buscado = normalizarTexto(textoBuscado);
      const agente = normalizarTexto(registro.agente);

      const identidades = {
        japo: ["japo", "nobu tanaka", "japo nobu tanaka", "378"],
        phoenix: ["phoenix", "tony shelby", "707"],
        onyx: ["onyx", "013"],
        rayo: ["rayo", "666"],
        orion: ["orion", "011"],
        cypher: ["cypher", "antonio reyes", "007"],
        strike: ["strike", "richard barrul", "231"],
        gaby: ["gaby", "john williams", "222"],
        nano: ["nano", "jordi fernandez", "690"],
        cobra: ["cobra", "oscar molina", "117"],
        india: ["india", "olivia dominguez", "555"],
        shadow: ["shadow", "paul agamuste"]
      };

      const grupo = Object.values(identidades).find(nombres => {
        return nombres.some(nombre => {
          return nombre === buscado ||
            nombre.includes(buscado) ||
            buscado.includes(nombre);
        });
      });

      if (!grupo) {
        return agente === buscado || agente.includes(buscado) || buscado.includes(agente);
      }

      return grupo.some(nombre => {
        return agente === nombre || agente.includes(nombre) || nombre.includes(agente);
      });
    }

    function actualizarRecuento() {
      const nombre = buscarAgente.value.trim();

      if (!nombre) {
        resultadoRecuento.textContent = "0";
        ultimaFecha.textContent = "—";
        listadoAgente.textContent = "No hay registros para este agente.";
        return;
      }

      if (!registrosCargados) {
        resultadoRecuento.textContent = "…";
        ultimaFecha.textContent = "—";
        listadoAgente.textContent = "Cargando registros...";
        return;
      }

      const filtrados = registros
        .filter(registro => perteneceAlAgente(registro, nombre))
        .sort((a, b) => fechaParaOrdenar(b.fecha) - fechaParaOrdenar(a.fecha));

      resultadoRecuento.textContent = String(filtrados.length);
      ultimaFecha.textContent = filtrados.length
        ? formatearFecha(filtrados[0].fecha)
        : "—";

      listadoAgente.textContent = filtrados.length
        ? filtrados.map((registro, indice) => {
            const esImagen = /\.(jpeg|jpg|gif|png|webp)($|\?)/i.test(registro.clip) || String(registro.clip).includes("google.com");
            return [
              `REGISTRO ${indice + 1} · PERSONA REVIVIDA`,
              `Agente: ${registro.agente}`,
              `Fecha: ${formatearFecha(registro.fecha)}`,
              `${esImagen ? 'Imagen' : 'Clip'}: ${registro.clip}`
            ].join("\n");
          }).join("\n\n")
        : "No hay registros para este agente.";

      ajustarAlturaPanel();
    }

    async function cargarRegistros() {
      try {
        const respuesta = await fetch(`${URL_APPS_SCRIPT}?t=${Date.now()}`, {
          method: "GET",
          cache: "no-store"
        });

        if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);

        const datos = await respuesta.json();

        if (!datos.ok || !Array.isArray(datos.registros)) {
          throw new Error("No se pudieron leer los registros.");
        }

        registros.splice(0, registros.length, ...datos.registros);
        registrosCargados = true;
        actualizarRecuento();
      } catch (error) {
        console.error("Error leyendo Google Sheets:", error);
        listadoAgente.textContent = "No se pudieron cargar los registros.";
      }
    }

    async function guardarEnGoogle(registroPayload) {
      const respuesta = await fetch(URL_APPS_SCRIPT, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(registroPayload)
      });

      const datos = await respuesta.json();

      if (!datos.ok) {
        throw new Error(datos.error || "No se pudo guardar en Google Sheets.");
      }
      return datos.url || registroPayload.clip;
    }

    guardarBtn.addEventListener("click", async () => {
      limpiarEstado();

      const agente = agenteInput.value.trim();
      const fecha = fechaInput.value;
      const clip = clipInput.value.trim();

      if (!agente || !fecha || (!clip && !base64ArchivoLocal)) {
        statusRegistro.textContent = "Completa nombre del agente, fecha y enlace o archivo de imagen.";
        statusRegistro.classList.add("error");
        return;
      }

      if (clip && !base64ArchivoLocal && !esUrlValida(clip)) {
        statusRegistro.textContent = "Debes ingresar un enlace URL válido si no subes un archivo.";
        statusRegistro.classList.add("error");
        return;
      }

      const payload = {
        agente,
        fecha,
        clip: clip || "",
        archivoBase64: base64ArchivoLocal || "",
        nombreArchivo: nombreArchivoLocal || "",
        tipoMime: tipoMimeLocal || ""
      };

      guardarBtn.disabled = true;
      guardarBtn.textContent = base64ArchivoLocal ? "Subiendo a Drive..." : "Guardando...";

      try {
        const urlFinal = await guardarEnGoogle(payload);
        const nuevoReg = { agente, fecha, clip: urlFinal };
        registros.unshift(nuevoReg);
        previewRegistro.textContent = generarTextoRegistro(nuevoReg);
        statusRegistro.textContent = "Registro e imagen guardados correctamente.";
        statusRegistro.classList.add("ok");

        // Limpieza de campos
        agenteInput.value = "";
        clipInput.value = "";
        clipInput.placeholder = "https://clip.com/... o https://i.imgur.com/...";
        archivoImagen.value = "";
        base64ArchivoLocal = null;
        nombreArchivoLocal = "";
        tipoMimeLocal = "";
        fileInfo.style.display = "none";
        fechaInput.value = obtenerFechaLocalISO();
        actualizarRecuento();
      } catch (error) {
        statusRegistro.textContent = error.message;
        statusRegistro.classList.add("error");
      } finally {
        guardarBtn.disabled = false;
        guardarBtn.textContent = "Guardar registro";
        ajustarAlturaPanel();
      }
    });

    copiarBtn.addEventListener("click", async () => {
      const texto = previewRegistro.textContent.trim();

      if (!texto || texto === "Aquí aparecerá el texto generado del registro.") {
        statusRegistro.textContent = "Primero guarda un registro para generar el texto.";
        statusRegistro.className = "status error";
        return;
      }

      try {
        await navigator.clipboard.writeText(texto);
        statusRegistro.textContent = "Texto copiado al portapapeles.";
        statusRegistro.className = "status ok";
      } catch {
        statusRegistro.textContent = "No se pudo copiar automáticamente.";
        statusRegistro.className = "status error";
      }
    });

    buscarAgente.addEventListener("input", actualizarRecuento);

    const modalJefatura = document.getElementById("modalJefatura");
    const abrirJefatura = document.getElementById("abrirJefatura");
    const cancelarJefatura = document.getElementById("cancelarJefatura");
    const entrarJefatura = document.getElementById("entrarJefatura");
    const contrasenaJefatura = document.getElementById("contrasenaJefatura");
    const errorJefatura = document.getElementById("errorJefatura");
    const CONTRASENA_JEFATURA = "UME2026";
    const PAGINA_JEFATURA = "JEFATURA.html";

    function abrirModalJefatura() {
      modalJefatura.classList.add("abierto");
      contrasenaJefatura.value = "";
      errorJefatura.classList.remove("visible");
      setTimeout(() => contrasenaJefatura.focus(), 50);
    }

    function cerrarModalJefatura() {
      modalJefatura.classList.remove("abierto");
    }

    abrirJefatura.addEventListener("click", abrirModalJefatura);
    cancelarJefatura.addEventListener("click", cerrarModalJefatura);

    modalJefatura.addEventListener("click", event => {
      if (event.target === modalJefatura) cerrarModalJefatura();
    });

    entrarJefatura.addEventListener("click", () => {
      if (contrasenaJefatura.value === CONTRASENA_JEFATURA) {
        window.location.href = PAGINA_JEFATURA;
      } else {
        errorJefatura.classList.add("visible");
        contrasenaJefatura.select();
      }
    });

    contrasenaJefatura.addEventListener("keydown", event => {
      if (event.key === "Enter") entrarJefatura.click();
      if (event.key === "Escape") cerrarModalJefatura();
    });

    cargarRegistros();
    setInterval(cargarRegistros, 5000);
    setTimeout(ajustarAlturaPanel, 0);
  </script>
